[project]
name = "vgi-conform"
version = "0.5.0"
description = "Validate + normalize phone/email/IBAN/VAT/card/URL/postal fields for DuckDB via VGI"
readme = "README.md"
keywords = [
    "duckdb",
    "apache-arrow",
    "vgi",
    "sql",
    "validation",
    "normalization",
    "phone",
    "email",
    "iban",
    "vat",
    "credit-card",
    "url",
    "postal-code",
]
license = { file = "LICENSE" }
authors = [{ name = "Query Farm LLC", email = "hello@query.farm" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.14"
dependencies = [
    "vgi-python>=0.55.2,<0.56",
    "phonenumbers>=9.0",
    "python-stdnum>=2.2",
    "email-validator>=2.3",
    "pyarrow>=18",
]

[project.optional-dependencies]
# HTTP transport: the worker can serve over HTTP (`conform_worker.py --http`) in
# addition to stdio. That path needs vgi-python's `http` extra (waitress).
# CI's http transport leg installs this via `uv sync --extra http`.
http = [
    "vgi-python[http]>=0.55.2,<0.56",
]
# HTTP-serving extra installed by the Docker image (`pip install '.[serve]'`):
# `http` so the container can serve `--http` (/health + VGI RPC), plus `oauth`
# (JWT verification) so the image can run in Orchard hosted mode
# (`VGI_ORCHARD_HOSTED=1` with VGI_JWT_ISSUER/AUDIENCE/JWKS_URI and VGI_SIGNING_KEY).
serve = [
    "vgi-python[http,oauth]>=0.55.2,<0.56",
]
dev = [
    "pytest>=8",
    "ruff",
    "mypy",
    "pyarrow-stubs",
    "pydoclint",
]

[project.scripts]
# stdio worker entry point (used by the Docker image's `stdio` transport and by a
# filesystem-LOCATION ATTACH via bin/vgi-conform-worker).
vgi-conform-worker = "vgi_conform.worker:main"

[project.urls]
Repository = "https://github.com/Query-farm/vgi-conform"
Issues = "https://github.com/Query-farm/vgi-conform/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vgi_conform"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]

[tool.ruff.lint.per-file-ignores]
# Docstrings (D) are enforced on the worker package/script (product code), not tests.
"tests/**" = ["D"]
"conftest.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.pydoclint]
# Docstring consistency gate (complements ruff's D rules: ruff checks docstring
# shape, pydoclint checks documented args/returns/attrs match the code).
style = "google"
arg_type_hints_in_docstring = false
check_return_types = false
check_yield_types = false
check_class_attributes = true
skip_checking_raises = true
allow_init_docstring = true

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Genuinely untyped third-party libraries (no stubs published).
module = ["phonenumbers.*", "stdnum.*", "email_validator.*"]
ignore_missing_imports = true
